<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motivations-Galerie</title>
<style>
  :root {
    --bg-start: #1e2a52;
    --bg-end: #6c3fa3;
    --card-bg: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end) 60%, #e0862c);
    background-attachment: fixed;
    color: #fff;
    padding: 40px 24px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 2.4rem;
    margin: 0 0 8px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
  }

  header p {
    margin: 0;
    opacity: 0.85;
    font-size: 1.05rem;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    max-width: 1400px;
    margin: 0 auto;
  }

  @media (max-width: 1100px) {
    .gallery { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 750px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 450px) {
    .gallery { grid-template-columns: 1fr; }
  }

  .card {
    position: relative;
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 4 / 3;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 14px 30px rgba(0,0,0,0.5);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.08) contrast(1.03);
    cursor: zoom-in;
  }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 40px;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    cursor: zoom-out;
  }
</style>
</head>
<body>

<header>
  <h1>✨ Motivations-Galerie ✨</h1>
</header>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  const themes = [
    ["hot-air-balloon,mountains", "Ballonfahrt über den Bergen"],
    ["beach,vacation", "Strandurlaub"],
    ["sports,stadium", "Sportveranstaltung"],
    ["forest,nature", "Ruhe im Wald"],
    ["sunset,ocean", "Sonnenuntergang am Meer"],
    ["mountaintrail,backpacker", "Wanderabenteuer"],
    ["surfing,wave", "Surfen"],
    ["skiing,snow", "Skifahren"],
    ["camping,campfire", "Camping am Lagerfeuer"],
    ["lake,mountains", "Bergsee"],
    ["waterfall,jungle", "Wasserfall"],
    ["roadtrip,desert", "Roadtrip"],
    ["city,skyline,night", "Skyline bei Nacht"],
    ["festival,crowd", "Festival-Stimmung"],
    ["concert,lights", "Konzert-Feeling"],
    ["yoga,meditation", "Yoga & Achtsamkeit"],
    ["running,marathon", "Marathon-Ziel"],
    ["cycling,mountains", "Radtour"],
    ["sailing,sea", "Segeln"],
    ["northernlights,sky", "Polarlichter"],
    ["desert,dunes", "Wüstendüne"],
    ["tropical,palmtree", "Tropisches Paradies"],
    ["garden,flowers", "Blühender Garten"],
    ["fireworksdisplay,nightsky", "Feuerwerk"]
  ];

  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  themes.forEach(([tags, label], i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = label;
    img.src = `https://loremflickr.com/640/480/${tags}?lock=${i + 1}`;
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
    });

    card.appendChild(img);
    gallery.appendChild(card);
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }
  });
</script>

</body>
</html>
